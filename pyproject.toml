[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "trustforge"
version = "0.0.1.dev0"
description = "Educational OCI supply-chain verification laboratory"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "TrustForge contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.16,<1",
  "rich>=14,<15",
  "pydantic>=2.11,<3",
]

[project.urls]
Repository = "https://github.com/jnbntc/trustforge"
Issues = "https://github.com/jnbntc/trustforge/issues"

[project.scripts]
trustforge = "trustforge.cli:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.17,<0.18",
  "mypy>=1.20,<2",
  "hatchling==1.33.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trustforge"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs/PYTHON_DEVELOPMENT.md",
  "/pyproject.toml",
  "/uv.lock",
  "/.python-version",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
